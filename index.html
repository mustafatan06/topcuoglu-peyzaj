    <!-- KESİN ÇÖZÜM: Tasarımı bozmadan ana sayfadaki tüm grid görsellerini eşit ve nizami boyuta kilitleyen stil -->
    <style>
      /* Tüm görselleri kırpılmadan ve taşmadan kutuya tam sığdırır */
      img {
        object-fit: cover !important;
        object-position: center !important;
        width: 100% !important;
        height: 100% !important;
      }
      
      /* Ana sayfadaki asimetrik büyük/uzun kutuları eşit yatay dikdörtgen/kare nizama sokar */
      section div[class*="grid"] > div, 
      main div[class*="grid"] > div {
        aspect-ratio: 16 / 10 !important;
      }
    </style>
